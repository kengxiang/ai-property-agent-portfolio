name: ai-property-portfolio

x-db-environment: &db-environment
  POSTGRES_DB: ${POSTGRES_DB:-property_agent}
  POSTGRES_USER: ${POSTGRES_USER:-property_agent}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private Compose env file}

x-app-environment: &app-environment
  <<: *db-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

x-app-image: &app-image
  image: ${COMPOSE_APP_IMAGE:-ai-property-portfolio-app:local}
  pull_policy: never

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment: *db-environment
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    networks:
      default:
        aliases: [property-db]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app-image
    environment: *app-environment
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app-image
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *app-environment
      PROPERTY_BACKEND: postgres
      ADMIN_INGESTION_ENABLED: ${ADMIN_INGESTION_ENABLED:-0}
      ADMIN_SANDBOX_PROJECT: ${COMPOSE_PROJECT_NAME}
      RAG_BACKEND: postgres
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      MODEL_TIMEOUT_S: ${MODEL_TIMEOUT_S:-120}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_REQUESTS_PER_MINUTE: ${GEMINI_REQUESTS_PER_MINUTE:-10}
    ports:
      - "127.0.0.1:${COMPOSE_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  frontend:
    <<: *app-image
    environment:
      PROPERTY_API_BASE_URL: http://backend:8000
      ADMIN_INGESTION_ENABLED: ${ADMIN_INGESTION_ENABLED:-0}
    command: ["python", "-m", "streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    ports:
      - "127.0.0.1:${COMPOSE_FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:fabce3e9678a07d2dde83bd8f5124017f3ec457d0a3fc6b63bb4cec465d63861
    environment:
      WEBHOOK_URL: http://localhost:${COMPOSE_N8N_PORT:-15678}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
    ports:
      - "127.0.0.1:${COMPOSE_N8N_PORT:-15678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  worker:
    <<: *app-image
    profiles: ["automation"]
    environment:
      <<: *app-environment
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/lead-created
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      OUTBOX_HTTP_TIMEOUT: ${OUTBOX_HTTP_TIMEOUT:-10}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-2}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
    command: ["python", "-m", "automation.outbox_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      n8n:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
